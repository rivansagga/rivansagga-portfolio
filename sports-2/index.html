<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Adidas x JD – Riyadh</title>

  <style>
    body {
      margin: 0;
      background: #2f2f2f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 1200px;
      margin: auto;
      padding: 45px 40px 70px;
    }

    .back {
      display: inline-block;
      color: white;
      text-decoration: none;
      font-size: 16px;
      margin-bottom: 35px;
    }

    .back:hover {
      opacity: 0.7;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 52px;
      margin: 0 0 14px;
    }

    .info {
      font-size: 17px;
      line-height: 1.5;
      margin-bottom: 40px;
    }

    .cover {
      width: 100%;
      margin-bottom: 25px;
    }

    .cover img {
      width: 100%;
      display: block;
      max-height: 650px;
      object-fit: cover;
    }

    .gallery {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .gallery img {
      width: 100%;
      height: 420px;
      object-fit: cover;
      display: block;
    }

    .gallery img:nth-child(3) {
      height: 500px;
    }

    @media (max-width: 700px) {
      .page {
        padding: 30px 20px 50px;
      }

      h1 {
        font-size: 40px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }

      .gallery img,
      .gallery img:nth-child(3) {
        height: auto;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <a href="../index.html#sports" class="back">
      ← Back to Sports
    </a>

    <h1>Adidas x JD</h1>

    <div class="info">
      Riyadh · 2026<br>
      Sports Campaign
    </div>

    <!-- COVER PHOTO -->
    <div class="cover">
      <img
        src="images/IMG_3799.jpg"
        alt="Adidas x JD – Riyadh"
      >
    </div>

    <!-- GALLERY -->
    <div class="gallery">

      <img
        src="images/IMG_3800.jpg"
        alt="Adidas x JD – Riyadh"
      >

      <img
        src="images/IMG_3801.jpg"
        alt="Adidas x JD – Riyadh"
      >

      <img
        src="images/IMG_3802.jpg"
        alt="Adidas x JD – Riyadh"
      >

      <img
        src="images/IMG_3803.jpg"
        alt="Adidas x JD – Riyadh"
      >

      <img
        src="images/IMG_3804.jpg"
        alt="Adidas x JD – Riyadh"
      >

      <img
        src="images/IMG_3805.jpg"
        alt="Adidas x JD – Riyadh"
      >

    </div>

  </div>

</body>
</html>
