<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Puma</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #252733;
      color: white;
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 45px 60px 70px;
    }

    .back {
      display: inline-block;
      color: white;
      text-decoration: none;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .back:hover {
      text-decoration: underline;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 52px;
      margin: 0 0 18px;
    }

    .meta {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .cover {
      width: 100%;
      margin-bottom: 18px;
    }

    .cover img {
      width: 100%;
      height: auto;
      display: block;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .gallery img,
    .gallery video {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 700px) {
      .page {
        padding: 30px 25px 50px;
      }

      h1 {
        font-size: 40px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <a href="../index.html#sports" class="back">← Back to Sports</a>

    <h1>Puma</h1>

    <div class="meta">
      Riyadh · 2026<br>
      Sports Campaign
    </div>

    <div class="cover">
      <img src="images/IMG_3847.jpg" alt="Puma cover">
    </div>

    <div class="gallery">

      <img src="images/IMG_3848.jpg" alt="Puma campaign image">

      <img src="images/IMG_3849.jpg" alt="Puma campaign image">

      <img src="images/IMG_3851.jpg" alt="Puma campaign image">

      <img src="images/IMG_3852.jpg" alt="Puma campaign image">

      <img src="images/IMG_3853.jpg" alt="Puma campaign image">

      <video controls>
        <source src="images/puma-video-1.mp4" type="video/mp4">
      </video>

    </div>

  </div>

</body>
</html>
