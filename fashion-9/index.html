<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>House of Hype Opening</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #2f2f2f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 45px 60px 70px;
    }

    .back {
      display: inline-block;
      color: white;
      text-decoration: none;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .back:hover {
      text-decoration: underline;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 52px;
      margin: 0 0 18px;
    }

    .meta {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .cover {
      width: 100%;
      margin-bottom: 18px;
    }

    .cover img {
      width: 100%;
      height: auto;
      display: block;
    }

   .gallery {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
}

.gallery img,
.gallery video {
  width: 100%;
  height: 420px;
  object-fit: cover;
  display: block;
}

    @media (max-width: 700px) {
      .page {
        padding: 30px 25px 50px;
      }

      h1 {
        font-size: 40px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <a href="../index.html#fashion" class="back">← Back to Fashion</a>

    <h1>House of Hype Opening</h1>

    <div class="meta">
      Riyadh · 2024<br>
      Fashion Campaign
    </div>

    <div class="cover">
      <img src="images/IMG_3987.jpg" alt="House of Hype Opening cover">
    </div>

    <div class="gallery">

      <img src="images/IMG_3982.jpg" alt="House of Hype Opening">
      <img src="images/IMG_3983.jpg" alt="House of Hype Opening">
      <img src="images/IMG_3984.jpg" alt="House of Hype Opening">
      <img src="images/IMG_3985.jpg" alt="House of Hype Opening">
      <img src="images/IMG_3986.jpg" alt="House of Hype Opening">
      <img src="images/IMG_3988.jpg" alt="House of Hype Opening">

      <video controls>
        <source src="images/hoh-1.mp4" type="video/mp4">
      </video>

    </div>

  </div>

</body>
</html>
