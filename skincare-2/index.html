<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>L'Oréal x Valentino Beauty — Rivan Sagga</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Space+Grotesk:wght@400;500&display=swap" rel="stylesheet">

  <style>

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #2f2f2f;
      color: #ffffff;
      font-family: 'Space Grotesk', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* PAGE */

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 45px 60px 70px;
    }

    /* BACK BUTTON */

    .back {
      display: inline-block;
      color: #ffffff;
      text-decoration: none;
      font-size: 0.9rem;
      margin-bottom: 55px;
      opacity: 0.75;
      transition: opacity 0.2s ease;
    }

    .back:hover {
      opacity: 1;
    }

    /* TITLE */

    .kicker {
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      opacity: 0.6;
      margin-bottom: 16px;
    }

    h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(3rem, 7vw, 5.2rem);
      font-weight: 400;
      line-height: 1;
      margin: 0 0 20px;
    }

    .description {
      max-width: 600px;
      font-size: 1rem;
      line-height: 1.7;
      opacity: 0.7;
      margin-bottom: 45px;
    }

    /* COVER */

    .cover {
      width: 100%;
      margin-bottom: 22px;
    }

    .cover img {
      width: 100%;
      height: auto;
      display: block;
      object-fit: cover;
    }

    /* GALLERY */

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }

    .gallery img,
    .gallery video {
      width: 100%;
      aspect-ratio: 4 / 5;
      height: auto;
      display: block;
      object-fit: cover;
      background: #111111;
    }

    /* MOBILE */

    @media (max-width: 700px) {

      .page {
        padding: 30px 20px 50px;
      }

      .back {
        margin-bottom: 40px;
      }

      h1 {
        font-size: 3rem;
      }

      .description {
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 32px;
      }

      .cover {
        margin-bottom: 14px;
      }

      .gallery {
        grid-template-columns: 1fr;
        gap: 14px;
      }

      .gallery img,
      .gallery video {
        aspect-ratio: 4 / 5;
        width: 100%;
        height: auto;
        object-fit: cover;
      }

    }

  </style>
</head>


<body>

  <main class="page">

    <!-- BACK -->

    <a href="../index.html#Skincare%20%26%20Beauty" class="back">
      ← Back to Skincare & Beauty
    </a>


    <!-- TITLE -->

    <div class="kicker">
      Skincare & Beauty
    </div>

    <h1>L'Oréal x Valentino Beauty</h1>

    <p class="description">
      Beauty campaign featuring L'Oréal and Valentino Beauty.
    </p>


    <!-- COVER -->

    <div class="cover">
      <img
        src="images/IMG_4121.jpg"
        alt="L'Oréal x Valentino Beauty">
    </div>


    <!-- GALLERY -->

    <div class="gallery">

      <!-- PHOTO -->

      <img
        src="images/IMG_3246 2.png"
        alt="L'Oréal x Valentino Beauty">

      <!-- PHOTO -->

      <img
        src="images/IMG_4122.jpg"
        alt="L'Oréal x Valentino Beauty">


      <!-- VIDEO 1 -->

      <video controls playsinline preload="metadata">
        <source src="images/val-vid-1.mp4" type="video/mp4">
      </video>


      <!-- VIDEO 2 -->

      <video controls playsinline preload="metadata">
        <source src="images/val-vid-2.mp4" type="video/mp4">
      </video>


      <!-- VIDEO 3 -->

      <video controls playsinline preload="metadata">
        <source src="images/val-vid-3.mp4" type="video/mp4">
      </video>


      <!-- VIDEO 4 -->

      <video controls playsinline preload="metadata">
        <source src="images/val-vid-4.mp4" type="video/mp4">
      </video>


      <!-- VIDEO 5 -->

      <video controls playsinline preload="metadata">
        <source src="images/val-vid-5.mp4" type="video/mp4">
      </video>

    </div>

  </main>

</body>
</html>
