<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sunwear</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #2f2f2f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 45px 60px 70px;
    }

    .back {
      display: inline-block;
      color: white;
      text-decoration: none;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .back:hover {
      text-decoration: underline;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 52px;
      margin: 0 0 18px;
    }

    .meta {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .cover {
      width: 100%;
      margin-bottom: 18px;
    }

    .cover img {
      width: 100%;
      height: auto;
      display: block;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
    }

    .gallery img {
      width: 100%;
      height: auto;
      display: block;
    }

    @media (max-width: 700px) {
      .page {
        padding: 30px 25px 50px;
      }

      h1 {
        font-size: 40px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <a href="../index.html#sunwear" class="back">← Back to Sunwear</a>

    <h1>Sunwear</h1>

    <div class="meta">

    </div>

    <div class="cover">
      <img src="images/IMG_1650.jpg" alt="Sunwear cover">
    </div>

    <div class="gallery">
      <img src="images/IMG_1645.jpg" alt="Sunwear campaign image">
      <img src="images/IMG_1646.jpg" alt="Sunwear campaign image">
      <img src="images/IMG_1647.jpg" alt="Sunwear campaign image">
      <img src="images/IMG_1648.jpg" alt="Sunwear campaign image">
      <img src="images/IMG_1649.jpg" alt="Sunwear campaign image">
      <img src="images/IMG_3785.jpg" alt="Sunwear campaign image">
      <img src="images/IMG_3786.jpg" alt="Sunwear campaign image">
    </div>

  </div>

</html>
