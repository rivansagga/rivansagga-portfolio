<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Footlab Shoot</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #2f2f2f;
      color: white;
      font-family: Arial, sans-serif;
    }

    .page {
      max-width: 1200px;
      margin: 0 auto;
      padding: 45px 60px 70px;
    }

    .back {
      display: inline-block;
      color: white;
      text-decoration: none;
      font-size: 15px;
      margin-bottom: 28px;
    }

    .back:hover {
      text-decoration: underline;
    }

    h1 {
      font-family: Georgia, serif;
      font-size: 52px;
      margin: 0 0 18px;
    }

    .meta {
      font-size: 15px;
      line-height: 1.6;
      margin-bottom: 35px;
    }

    .cover {
      width: 100%;
      margin-bottom: 18px;
    }

    .cover img {
      display: block;
      width: 100%;
      height: auto !important;
      max-height: none !important;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 18px;
      align-items: start;
    }

    .gallery img {
      display: block;
      width: 100%;
      height: auto !important;
      max-height: none !important;
      object-fit: initial !important;
    }

    @media (max-width: 700px) {
      .page {
        padding: 30px 25px 50px;
      }

      h1 {
        font-size: 40px;
      }

      .gallery {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="page">

    <a href="../index.html#footwear" class="back">
      ← Back to Footwear
    </a>

    <h1>Footlab Shoot</h1>

    <div class="meta">
      Riyadh · 2026<br>
      Footwear Campaign
    </div>

    <div class="cover">
      <img
        src="images/IMG_3960.jpg"
        alt="Footlab Shoot cover"
      >
    </div>

    <div class="gallery">

      <img
        src="images/IMG_3955.jpg"
        alt="Footlab Shoot"
      >

      <img
        src="images/IMG_3956.jpg"
        alt="Footlab Shoot"
      >

      <img
        src="images/IMG_3958.jpg"
        alt="Footlab Shoot"
      >

      <img
        src="images/IMG_3959.jpg"
        alt="Footlab Shoot"
      >

      <img
        src="images/IMG_3962.jpg"
        alt="Footlab Shoot"
      >

      <img
        src="images/IMG_3963.jpg"
        alt="Footlab Shoot"
      >

    </div>

  </div>

</body>
</html>
